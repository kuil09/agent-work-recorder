[package]
name = "rec"
version = "0.1.0"
edition = "2021"
description = "Agent Work Recorder — macOS CLI screen recorder for coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
