name: macOS distribution

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'scripts/**'
      - 'src/**'
      - 'macos/RecCapture/**'
      - 'skills/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/check_macos_package.py'
      - '.github/workflows/distribution.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check architecture and tagged version
        run: |
          test "$(uname -m)" = arm64
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
      - name: Build and verify development DMG
        run: make package
      - name: Verify the app from the actual disk image
        run: |
          MOUNT="$RUNNER_TEMP/rec-package-mounted"
          hdiutil attach -readonly -nobrowse dist/*.dmg -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT"' EXIT
          python3 tests/check_macos_package.py "$MOUNT/Agent Work Recorder.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-development-dmg
          path: dist/*
          if-no-files-found: error
